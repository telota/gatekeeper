name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Job: Erstellt das Release-Objekt auf GitHub
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # 2. Job: Baut parallel für x86_64 und aarch64 und lädt die Tarballs hoch
  upload-assets:
    name: Build & Upload (${{ matrix.target }})
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and upload release binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: gatekeeper
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tar: unix
          zip: false
          include: |
            config.toml.example
            theme.toml.example
            set-config.sh
            services
            docs/implementation/nginx/snippets