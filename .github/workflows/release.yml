name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-assets:
    name: Build & Upload (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build and upload release binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: gatekeeper
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tar: unix
          zip: false
          dry-run: ${{ github.event_name == 'workflow_dispatch' }}
          dry-run-intended: ${{ github.event_name == 'workflow_dispatch' }}
          include: |
            config.toml.example
            theme.toml.example
            set-config.sh
            services
            docs/implementation/nginx/snippets