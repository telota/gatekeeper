# Copy this snippet to Nginx's configuration directory (e.g., /etc/nginx/snippets/gatekeeper/endpoints.conf;)
# and include it inside your main server block (e.g., include snippets/gatekeeper/endpoints.conf;)

# Internal Gatekeeper Auth Facade
location = /gatekeeper {
    internal;
    proxy_pass http://gatekeeper/auth/check;
    
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    
    proxy_set_header X-Original-IP $remote_addr;
    proxy_set_header X-Original-Host $host;
    proxy_set_header X-Original-URI $request_uri;
    
    proxy_set_header X-TLS-Protocol $ssl_protocol;
    proxy_set_header X-TLS-Cipher $ssl_cipher;

    proxy_set_header X-Http-Lang $http_accept_language;
    proxy_set_header X-Http-Enc $http_accept_encoding;
    proxy_set_header User-Agent $http_user_agent;

    # Fail-Open Mechanism: If Gaekeeper backend is offline (502/504), intercept and return 200 (allow)
    proxy_intercept_errors on;
    error_page 502 504 =200 /gatekeeper-fallback;
}

# Gatekeeper Fallback on error
location = /gatekeeper-fallback {
    internal;
    return 200;
}

location = /verify-request {
    proxy_pass http://gatekeeper/auth/verify;

    proxy_set_header X-Original-IP $remote_addr;
    proxy_set_header X-Original-Host $host;
    proxy_set_header X-Original-URI $request_uri;
    
    proxy_set_header X-TLS-Protocol $ssl_protocol;
    proxy_set_header X-TLS-Cipher $ssl_cipher;

    proxy_set_header X-Http-Lang $http_accept_language;
    proxy_set_header X-Http-Enc $http_accept_encoding;
    proxy_set_header User-Agent $http_user_agent;
}
