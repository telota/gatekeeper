# Copy this snippet to Nginx's configuration directory (e.g., /etc/nginx/snippets/gatekeeper/dashboard.conf;)
# and include it inside your main server block (e.g., include snippets/gatekeeper/dashboard.conf;)

# Gatekeeper Internal Dashboard Locations
location = /gatekeeper/dashboard {
    # Allow localhost / loopback
    allow 127.0.0.1;
    allow ::1;
    # Allow RFC 1918 Private/Intranet Ranges
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    # Deny everyone else
    deny all;

    # Point to the static dashboard html file
    alias /etc/gatekeeper/services/dashboard.html;
    default_type text/html;
}

location = /gatekeeper/dashboard/history {
    # Allow localhost / loopback
    allow 127.0.0.1;
    allow ::1;
    # Allow RFC 1918 Private/Intranet Ranges
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    # Deny everyone else
    deny all;

    # Point to the aggregated JSON metrics history
    alias /etc/gatekeeper/services/metrics_history.json;
    default_type application/json;
}
