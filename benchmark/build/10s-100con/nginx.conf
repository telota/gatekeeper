user nginx;
worker_processes auto;
# error_log /results/nginx_error.log info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    'status:$status body_bytes:$body_bytes_sent '
                    'upstream_status:$upstream_status';

    access_log off;
    sendfile on;
    keepalive_timeout 65;

    upstream gatekeeper {
        server unix:/var/run/gatekeeper/gatekeeper.sock;
    }

    server {
        listen 80;
        server_name localhost;

        # Internal Gatekeeper Auth Facade
        location = /gatekeeper {
            internal;
            proxy_pass http://gatekeeper/auth/check;
            
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            
            proxy_set_header X-Original-IP $remote_addr;
            proxy_set_header X-Original-Host $host;
            proxy_set_header X-Original-URI $request_uri;
            
            proxy_set_header X-TLS-Protocol $ssl_protocol;
            proxy_set_header X-TLS-Cipher $ssl_cipher;

            proxy_set_header X-Http-Lang $http_accept_language;
            proxy_set_header X-Http-Enc $http_accept_encoding;
            proxy_set_header User-Agent $http_user_agent;

            # access_log /results/nginx_access.log main;
        }

        # Test 1: Unguarded Location
        location /unguard {
            return 200 "OK";
        }

        # Test 2 & 3: Guarded Location
        location /guard {
            auth_request /gatekeeper;
            proxy_pass http://127.0.0.1:80/dummy;
        }

        location = /dummy {
            internal;
            return 200 "OK";
        }
    }
}
